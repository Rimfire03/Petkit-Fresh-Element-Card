name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version from tag
        run: sed -i "s/^const CARD_VERSION = .*/const CARD_VERSION = \"${GITHUB_REF_NAME#v}\";/" petkit-fresh-element-card.js

      - name: Determine prerelease
        id: pre
        run: |
          case "$GITHUB_REF_NAME" in *-dev*|*-beta*|*-rc*) echo "v=true" >> $GITHUB_OUTPUT;; *) echo "v=false" >> $GITHUB_OUTPUT;; esac

      - name: Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --pretty=format:"* %s (%h)" "$PREV_TAG..$GITHUB_REF_NAME"); else LOG=$(git log --pretty=format:"* %s (%h)" -n 10 "$GITHUB_REF_NAME"); fi
          { echo "CHANGELOG<<EOF"; echo "$LOG"; echo "EOF"; } >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ### 🐶 Changes in ${{ github.ref_name }}

            ${{ env.CHANGELOG }}
          prerelease: ${{ steps.pre.outputs.v }}
          files: petkit-fresh-element-card.js
